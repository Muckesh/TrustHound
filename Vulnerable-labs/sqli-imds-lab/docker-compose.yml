services:
  db:
    build: ./db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopdb
    networks:
      - labnet
    restart: unless-stopped

  web:
    build: ./app
    environment:
      DB_HOST: db
      DB_NAME: shopdb
      DB_USER: appuser
      DB_PASSWORD: appuserpassword
    ports:
      - "80:5000"
    depends_on:
      - db
    networks:
      - labnet
    restart: unless-stopped

networks:
  labnet:
    driver: bridge
